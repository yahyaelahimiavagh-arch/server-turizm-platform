name: Baseline verification

on:
  pull_request:
  push:
    branches:
      - main
      - "migration/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show runtimes
        run: |
          php --version
          python3 --version
          node --version

      - name: Verify baseline
        run: ./scripts/verify-baseline.sh
